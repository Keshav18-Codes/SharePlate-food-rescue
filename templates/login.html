{% extends "base.html" %}
{% block title %}Login - SharePlate{% endblock %}
{% block content %}

<section class="form-card">
  <h1>Log in</h1>
  <form method="POST" class="stacked-form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="btn">Log in</button>
  </form>

  <p class="center-link">New here? <a href="{{ url_for('auth.home') }}">Create an account</a></p>
</section>

{% endblock %}
